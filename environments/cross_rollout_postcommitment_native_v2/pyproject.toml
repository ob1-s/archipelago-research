[project]
name = "cross-rollout-postcommitment-native-v2"
description = "Native two-turn post-commitment policy experiment with independent Phase-1 and Phase-2 presentation orders."
tags = ["cross-rollout", "policy-transmission", "post-commitment", "eval"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cross_rollout_postcommitment_native_v2"]

[tool.verifiers.eval]
num_examples = 4
rollouts_per_example = 1
