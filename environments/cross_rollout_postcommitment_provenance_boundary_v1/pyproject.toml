[project]
name = "cross-rollout-postcommitment-provenance-boundary-v1"
description = "High-resolution source-provenance and evidence-weighting boundary assay"
tags = ["cross-rollout", "postcommitment", "provenance", "evidence", "eval"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers==0.3.0",
    "mcp==1.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cross_rollout_postcommitment_provenance_boundary_v1"]

[tool.verifiers.eval]
num_examples = 1400
rollouts_per_example = 1
