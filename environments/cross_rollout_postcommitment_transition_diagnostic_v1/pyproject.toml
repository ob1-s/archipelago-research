[project]
name = "cross-rollout-postcommitment-transition-diagnostic-v1"
description = "Exploratory native two-turn transition diagnostic without culture exposure."
tags = ["cross-rollout", "policy-transitions", "post-commitment", "diagnostic"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cross_rollout_postcommitment_transition_diagnostic_v1"]

[tool.verifiers.eval]
num_examples = 4
rollouts_per_example = 1
