[project]
name = "cross-rollout-postcommitment-evidence-relative-v1"
description = "Native randomized evidence-relative predecessor-behavior experiment."
tags = ["cross-rollout", "post-commitment", "evidence", "predecessor-behavior"]
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "verifiers>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cross_rollout_postcommitment_evidence_relative_v1"]

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 240
