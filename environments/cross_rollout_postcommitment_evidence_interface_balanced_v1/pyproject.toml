[project]
name = "cross-rollout-postcommitment-evidence-interface-balanced-v1"
description = "Interface-balanced opaque-label evidence-based post-commitment experiment"
tags = ["cross-rollout", "postcommitment", "evidence", "eval"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers==0.3.0",
    "mcp==1.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cross_rollout_postcommitment_evidence_interface_balanced_v1"]

[tool.verifiers.eval]
num_examples = 240
rollouts_per_example = 1
