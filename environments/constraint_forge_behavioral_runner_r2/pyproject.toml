[project]
name = "constraint-forge-behavioral-runner-r2"
description = "Constraint Forge R1 register-coded substrate development runner (no scientific calls)."
tags = ["constraint-forge", "multi-agent", "behavioral-runner", "eval"]
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "verifiers==0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["constraint_forge_behavioral_runner_r2"]

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1
