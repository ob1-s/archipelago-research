[project]
name = "h1-live-runtime-adapter-v1"
description = "Process-isolated runtime and turnover boundary for a future bounded H1 pilot."
tags = ["mechanical-qualification", "turnover", "runtime-isolation", "nonscientific"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=46.0",
    "openai>=2.0",
    "verifiers==0.3.0",
]

[project.optional-dependencies]
dev = [
    "h1-model-free-apparatus-v1",
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[project.scripts]
h1-runtime-qualify = "h1_live_runtime_adapter_v1.qualification:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["h1_live_runtime_adapter_v1"]

[tool.uv.sources]
h1-model-free-apparatus-v1 = { path = "../h1_model_free_apparatus_v1", editable = true }

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
