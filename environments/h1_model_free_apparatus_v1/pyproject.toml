[project]
name = "h1-model-free-apparatus-v1"
description = "Deterministic qualification apparatus for turnover, carrier, parentage, and routine-reconstruction claims."
tags = ["model-free", "turnover", "provenance", "causal-validation"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers==0.3.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
]

[project.scripts]
h1-qualify = "h1_model_free_apparatus_v1.qualification:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["h1_model_free_apparatus_v1"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 1

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
