[project]
name = "cross-rollout-postcommitment-provenance-dose-response-v1"
description = "Native opaque-label provenance by advisory-strength dose-response assay"
tags = ["archipelago", "provenance", "dose-response", "eval"]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cross_rollout_postcommitment_provenance_dose_response_v1"]

[tool.verifiers.eval]
num_examples = 900
rollouts_per_example = 1
