[project]
name = "constraint-forge-behavioral-runner-v0"
description = "Native v1 multi-agent Constraint Forge behavioral runner with deterministic fake preflight."
tags = ["constraint-forge", "multi-agent", "behavioral-runner", "eval"]
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "verifiers==0.3.0",
    "constraint-forge-formation-v0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
constraint-forge-formation-v0 = { path = "../constraint_forge_formation_v0" }

[tool.hatch.build.targets.wheel]
packages = ["constraint_forge_behavioral_runner_v0"]

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1
