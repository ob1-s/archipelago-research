model = "gpt-5.6-luna"
num_tasks = 5040
num_rollouts = 1
shuffle = false
max_concurrent = 4
verbose = false
rich = false
server = false
push = false
output_dir = "/tmp/archipelago-cross-rollout-postcommitment-evidence-threshold-transport-v1-luna-2026-08-14"

[env]
id = ""
max_concurrent_agents = 1

[env.taskset]
id = "cross-rollout-postcommitment-evidence-threshold-transport-v1"
random_seed = "cross-rollout-postcommitment-evidence-threshold-transport-v1-random-2026-08-14"
schedule_seed = "cross-rollout-postcommitment-evidence-threshold-transport-v1-schedule-2026-08-14"
quota_state_path = "/tmp/archipelago-cross-rollout-postcommitment-evidence-threshold-transport-v1-quota-2026-08-14.json"

[env.taskset.task]
judges = []

[env.taskset.task.tools]
colocated = false

[env.taskset.task.tools.runtime]
type = "subprocess"

[env.timeout]

[env.retries]
max_retries = 0
include = []
exclude = []

[env.interception]
type = "elastic"
multiplex = 4

[env.agent]
max_turns = 14

[env.agent.harness]
id = "null"
forward_env = []
tool_timeout = 600.0
skills = []

[env.agent.harness.env]

[env.agent.runtime]
type = "subprocess"

[env.agent.timeout]

[env.agent.retries]
max_retries = 0
include = []
exclude = []

[serve]
address = "tcp://127.0.0.1:5000"

[serve.pool]
type = "elastic"
multiplex = 128

[legacy.args]

[legacy.extra_env_kwargs]

[client]
base_url = "http://127.0.0.1:10531/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[client.headers]

[sampling]
temperature = 0.7
max_tokens = 1024
