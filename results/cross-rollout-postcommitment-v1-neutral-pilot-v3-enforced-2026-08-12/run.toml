model = "Qwen/Qwen3.5-9B"
num_tasks = 2
num_rollouts = 16
max_concurrent = 1
push = false
rich = false

[env.taskset]
id = "cross-rollout-postcommitment-v1"
assignment_mode = "neutral"
assignment_seed = "postcommitment-neutral-pilot-v3-enforced"

[env.agent]
harness = { id = "cross-rollout-postcommitment-v1" }
runtime = { type = "subprocess" }

[sampling]
temperature = 0.7
max_tokens = 1024
