model = "Qwen/Qwen3.5-9B"
num_tasks = 2
num_rollouts = 160
shuffle = true
max_concurrent = 2
verbose = false
rich = false
server = false
push = false

[env]
id = ""
max_concurrent_agents = 1

[env.taskset]
id = "cross-rollout-postcommitment-confirmatory-v1"
assignment_mode = "post_b_success_random"
assignment_seed = "postcommitment-confirmatory-v1"

[env.taskset.task]
judges = []

[env.taskset.tools.runtime]
type = "subprocess"

[env.timeout]

[env.retries]
max_retries = 0
include = []
exclude = []

[env.interception]
type = "elastic"
multiplex = 32

[env.agent.harness]
id = "cross-rollout-postcommitment-confirmatory-v1"
forward_env = []
tool_timeout = 600.0
skills = []

[env.agent.harness.env]

[env.agent.runtime]
type = "subprocess"

[env.agent.timeout]

[env.agent.retries]
max_retries = 0
include = []
exclude = []

[serve]
address = "tcp://127.0.0.1:5000"

[serve.pool]
type = "elastic"
multiplex = 128

[legacy.args]

[legacy.extra_env_kwargs]

[client]
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[client.headers]

[sampling]
temperature = 0.7
max_tokens = 1024
