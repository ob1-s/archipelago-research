model = "Qwen/Qwen3.5-9B"
num_tasks = 2
num_rollouts = 160
shuffle = true
max_concurrent = 2
push = false
rich = false

[env.taskset]
id = "cross-rollout-postcommitment-confirmatory-v1"
assignment_mode = "post_b_success_random"
assignment_seed = "postcommitment-confirmatory-v1"

[env.agent]
harness = { id = "cross-rollout-postcommitment-confirmatory-v1" }
runtime = { type = "subprocess" }

[sampling]
temperature = 0.7
max_tokens = 1024
