model = "openai/gpt-5-mini"
num_tasks = 1
num_rollouts = 5
max_concurrent = 1
push = false
rich = false

[env.taskset]
id = "cross-rollout-culture-v1"
condition = "control"
notes_path = "/tmp/cross-rollout-culture-v1/control-notes.txt"

[env.agent]
harness = { id = "null" }
runtime = { type = "subprocess" }

[sampling]
temperature = 0.0
max_tokens = 2048
